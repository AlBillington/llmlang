[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmlang"
version = "0.1.0"
description = "A plain-text architecture-description language an LLM compiles into code, verified by a deterministic lockfile toolchain."
readme = "readme.md"
requires-python = ">=3.10"

[project.scripts]
llmlang = "llmlang.cli:main"

[tool.setuptools.packages.find]
where = ["compiler"]
include = ["llmlang*"]

[tool.llmlang]
coverage = true
