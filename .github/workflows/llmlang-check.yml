name: llmlang check

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - run: llmlang check .
      - run: python -m unittest discover -s tests -t .
        working-directory: examples/shortener
      - run: python verify_notes.py
        working-directory: examples/notes
