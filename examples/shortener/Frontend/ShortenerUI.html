<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Shortener UI</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; }
  input { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; font-size: 1rem; margin-top: 0.5rem; }
  #result { margin-top: 1rem; word-break: break-all; }
</style>
</head>
<body>
<h1>URL Shortener</h1>

<!-- shows a text input for a long URL and a submit button [llm:Frontend.ShortenerUI.form] -->
<form id="shorten-form">
  <input id="url-input" type="text" placeholder="https://example.com/very/long/url" required>
  <button type="submit">Shorten</button>
</form>

<div id="result"></div>

<script>
// uses UrlShortener to create a short code when submitted [llm:Frontend.ShortenerUI.shortenUrl]
async function shortenUrl(url) {
  const res = await fetch('/api/shorten', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url})
  });
  const data = await res.json();
  return data.code;
}

// displays the resulting short URL as a clickable link to the original URL [llm:Frontend.ShortenerUI.renderShortUrl]
function renderShortUrl(code) {
  const shortUrl = window.location.origin + '/' + code;
  document.getElementById('result').innerHTML =
    'Short URL: <a href="' + shortUrl + '">' + shortUrl + '</a>';
}

document.getElementById('shorten-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('url-input').value;
  const code = await shortenUrl(url);
  renderShortUrl(code);
});
</script>
</body>
</html>
